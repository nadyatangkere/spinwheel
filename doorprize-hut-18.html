<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doorprize | HUT ke-18 PT Daya Adicipta Wisesa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* =====================================================
           1. COLOR PALETTE
           Emerald Green + Gold + White Glass
        ===================================================== */

        :root {
            --green-dark: #123B29;
            --green-main: #174B35;
            --green-medium: #26734D;
            --green-light: #3A8A5D;
            --green-sage: #DCE8D8;

            --gold-dark: #B88A20;
            --gold-main: #F2C94C;
            --gold-light: #FFE28A;

            --ivory: #FFFDF4;
            --cream: #F8F5E9;

            --text-dark: #174B35;
            --text-muted: #52705C;

            --card-bg: rgba(255, 255, 255, 0.76);
            --card-border: rgba(255, 255, 255, 0.88);

            --display: 'Chakra Petch', 'Inter', sans-serif;
            --body-font: 'Inter', sans-serif;
        }

        /* =====================================================
           2. GLOBAL RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            position: relative;
            isolation: isolate;

            margin: 0;
            min-height: 100vh;
            padding: 0 24px 42px;

            font-family: var(--body-font);
            color: var(--text-dark);

            overflow-x: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 5%,
                    rgba(255, 253, 244, 0.98) 0%,
                    rgba(242, 235, 208, 0.88) 28%,
                    transparent 60%
                ),
                radial-gradient(
                    ellipse at 0% 18%,
                    rgba(58, 138, 93, 0.58),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 100% 15%,
                    rgba(242, 201, 76, 0.48),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 0% 100%,
                    rgba(23, 75, 53, 0.56),
                    transparent 48%
                ),
                radial-gradient(
                    ellipse at 100% 100%,
                    rgba(214, 167, 44, 0.38),
                    transparent 49%
                ),
                linear-gradient(
                    135deg,
                    #F8F5E9 0%,
                    #E5EBDD 38%,
                    #F8F2DE 68%,
                    #D9E5D7 100%
                );

            background-attachment: fixed;
        }

        /* Decorative background rays */

        body::before {
            content: "";

            position: fixed;
            inset: -20%;

            z-index: -1;
            pointer-events: none;

            background:
                repeating-conic-gradient(
                    from 242deg at 50% 52%,
                    transparent 0deg 5deg,
                    rgba(255, 255, 255, 0.24) 5.2deg 5.8deg,
                    transparent 6deg 12deg
                ),
                linear-gradient(
                    112deg,
                    transparent 20%,
                    rgba(255, 255, 255, 0.35) 32%,
                    transparent 38%,
                    transparent 62%,
                    rgba(255, 255, 255, 0.28) 68%,
                    transparent 76%
                );

            filter: blur(1px);
        }

        /* Decorative particles */

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            z-index: -1;
            pointer-events: none;

            opacity: 0.72;

            background-image:
                radial-gradient(
                    circle at 8% 18%,
                    #FFFFFF 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 18% 32%,
                    #FFFFFF 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 30% 12%,
                    #F2C94C 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 74% 15%,
                    #FFFFFF 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 89% 27%,
                    #F2C94C 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 95% 12%,
                    #FFFFFF 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 12% 76%,
                    #F2C94C 0 3px,
                    transparent 4px
                ),
                radial-gradient(
                    circle at 88% 81%,
                    #F2C94C 0 3px,
                    transparent 4px
                );
        }

        /* =====================================================
           3. MAIN LAYOUT
        ===================================================== */

        .app {
            width: 100%;
            max-width: 1360px;

            margin: 0 auto;
            padding-top: clamp(28px, 5vh, 64px);

            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* =====================================================
           4. PAGE TITLE
        ===================================================== */

        .page-title {
            margin: 0;

            text-align: center;

            font-family: var(--display);
            font-weight: 700;

            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.02;

            letter-spacing: 0.015em;

            color: var(--green-main);

            text-shadow:
                0 2px 0 rgba(255, 255, 255, 0.7),
                0 5px 18px rgba(23, 75, 53, 0.10);
        }

        .page-title span {
            display: block;
            margin-top: 10px;

            font-family: var(--body-font);
            font-size: clamp(12px, 1.6vw, 17px);

            font-weight: 700;
            letter-spacing: 0.18em;

            color: var(--gold-dark);
            text-transform: uppercase;
        }

        /* =====================================================
           5. WHITE GLASSMORPHISM CARDS
        ===================================================== */

        .card {
            position: relative;

            background: rgba(255, 255, 255, 0.76);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.88);
            border-top: 3px solid rgba(242, 201, 76, 0.95);

            border-radius: 20px;
            padding: 22px;

            display: flex;
            flex-direction: column;

            min-width: 0;

            box-shadow:
                0 12px 36px rgba(23, 75, 53, 0.10),
                0 4px 12px rgba(23, 75, 53, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .wheel-card {
            width: 100%;
            max-width: 860px;

            margin: 0 auto;

            align-items: center;
        }

        .side {
            display: grid;

            grid-template-columns:
                minmax(0, 0.8fr)
                minmax(0, 1.2fr);

            gap: 22px;
            align-items: start;

            min-width: 0;
        }

        .card-title {
            margin: 0 0 12px;

            font-family: var(--display);
            font-size: 20px;
            font-weight: 700;

            color: var(--green-main);
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: var(--text-muted);
        }

        /* =====================================================
           6. INPUTS AND TEXTAREA
        ===================================================== */

        textarea {
            width: 100%;
            min-height: 120px;
            max-height: 220px;

            resize: vertical;

            background: rgba(232, 241, 232, 0.78);

            border: 1px solid rgba(38, 115, 77, 0.25);
            border-radius: 11px;

            color: var(--green-main);

            font-family: var(--body-font);
            font-size: 14px;

            padding: 12px 14px;
            line-height: 1.5;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s,
                background 0.15s;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.96);

            border-color: var(--gold-dark);

            box-shadow:
                0 0 0 3px rgba(242, 201, 76, 0.18);
        }

        textarea::placeholder {
            color: #829786;
        }

        .row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;
            margin-top: 12px;
        }

        /* =====================================================
           7. BUTTONS
        ===================================================== */

        .btn {
            font-family: var(--display);
            font-weight: 700;
            font-size: 14px;

            border-radius: 10px;
            border: 1px solid rgba(38, 115, 77, 0.20);

            background: linear-gradient(
                135deg,
                #FFFFFF,
                #E8F1E8
            );

            color: var(--green-main);

            padding: 10px 16px;

            cursor: pointer;

            transition:
                transform 0.1s,
                background 0.15s,
                border-color 0.15s,
                filter 0.15s,
                box-shadow 0.15s;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--gold-dark);
            filter: brightness(1.04);

            box-shadow:
                0 4px 12px rgba(23, 75, 53, 0.08);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn:focus-visible,
        textarea:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--gold-dark);
            outline-offset: 3px;
        }

        /* Load button */

        .load-btn,
        .export-btn {
            background: linear-gradient(
                135deg,
                #FFE28A 0%,
                #F2C94C 52%,
                #D6A72C 100%
            );

            border: 1px solid rgba(184, 138, 32, 0.25);

            color: #173C29;
            font-weight: 700;

            box-shadow:
                0 4px 12px rgba(214, 167, 44, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .load-btn:hover:not(:disabled),
        .export-btn:hover:not(:disabled) {
            background: linear-gradient(
                135deg,
                #FFF0B5,
                #F7D96C,
                #E0B943
            );
        }

        /* Participant counter */

        #poolCount {
            font-family: var(--display);
            font-size: 13px;

            color: var(--green-main);

            background: rgba(220, 232, 216, 0.75);

            border: 1px solid rgba(38, 115, 77, 0.18);

            padding: 7px 11px;
            border-radius: 999px;

            white-space: nowrap;
        }

        /* =====================================================
           8. SPINNING WHEEL
        ===================================================== */

        .wheel-wrap {
            position: relative;

            width: min(64vh, 100%, 640px);
            aspect-ratio: 1;

            margin: 18px auto 0;
        }

        .wheel-wrap::before {
            content: "";

            position: absolute;
            inset: -7%;

            background: radial-gradient(
                circle,
                rgba(242, 201, 76, 0.22),
                rgba(58, 138, 93, 0.16) 44%,
                transparent 72%
            );

            z-index: 0;
            pointer-events: none;
        }

        .wheel-disc {
            position: relative;
            z-index: 1;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            transition:
                transform 4.2s cubic-bezier(.17, .67, .2, 1);

            filter:
                drop-shadow(0 12px 28px rgba(23, 75, 53, 0.24));
        }

        .wheel-disc canvas {
            width: 100%;
            height: 100%;

            display: block;

            border-radius: 50%;
        }

        /* Center logo */

        .hub {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 22%;
            aspect-ratio: 1;

            transform: translate(-50%, -50%);
            border-radius: 50%;

            background: var(--ivory);

            border: 5px solid var(--green-main);

            box-shadow:
                0 4px 18px rgba(23, 75, 53, 0.22),
                0 0 0 5px rgba(255, 255, 255, 0.88),
                0 0 24px rgba(242, 201, 76, 0.20);

            z-index: 6;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hub img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            padding: 5px;

            border-radius: 50%;
        }

        /* Wheel pointers */

        .pointer-layer {
            position: absolute;
            inset: 0;

            pointer-events: none;
            z-index: 5;
        }

        .pointer-arm {
            position: absolute;
            inset: 0;

            transform-origin: 50% 50%;
        }

        .pointer-tri {
            position: absolute;

            top: -18px;
            left: 50%;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 18px solid transparent;
            border-right: 18px solid transparent;

            border-top: 34px solid var(--gold-main);

            filter:
                drop-shadow(0 0 1px rgba(0, 0, 0, 0.25))
                drop-shadow(0 4px 6px rgba(0, 0, 0, 0.22));
        }

        /* =====================================================
           9. WHEEL CONTROLS
        ===================================================== */

        .controls {
            display: flex;
            align-items: flex-end;

            gap: 12px;
            margin-top: 26px;

            width: 100%;
            max-width: 420px;
        }

        .controls .field {
            flex: 1;
            min-width: 0;
        }

        .controls .field label {
            margin-bottom: 6px;
        }

        .controls input[type="number"] {
            width: 100%;

            background: rgba(232, 241, 232, 0.78);

            border: 1px solid rgba(38, 115, 77, 0.25);
            border-radius: 10px;

            color: var(--green-main);

            font-family: var(--display);
            font-size: 18px;

            padding: 10px 12px;

            outline: none;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        .controls input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.96);

            border-color: var(--gold-dark);

            box-shadow:
                0 0 0 3px rgba(242, 201, 76, 0.18);
        }

        /* Main spin button */

        #spinBtn {
            background: linear-gradient(
                135deg,
                #FFE28A 0%,
                #F2C94C 52%,
                #D6A72C 100%
            );

            border: 1px solid rgba(184, 138, 32, 0.25);

            color: #173C29;

            font-family: var(--display);
            font-weight: 700;
            font-size: 20px;

            letter-spacing: 0.06em;

            padding: 11px 34px;
            border-radius: 10px;

            box-shadow:
                0 7px 20px rgba(214, 167, 44, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        #spinBtn:hover:not(:disabled) {
            filter: brightness(1.07);

            box-shadow:
                0 9px 26px rgba(214, 167, 44, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.50);
        }

        #spinBtn:active:not(:disabled) {
            transform: translateY(1px);
        }

        #spinBtn:disabled {
            background: #DCE8D8;
            border-color: #C5D7C5;

            color: #78917C;
            box-shadow: none;
        }

        /* Status */

        .status {
            margin-top: 14px;

            font-size: 14px;
            color: var(--text-muted);

            min-height: 20px;
            text-align: center;
        }

        .status.live {
            color: var(--gold-dark);
            font-weight: 700;
        }

        /* =====================================================
           10. WINNERS PANEL
        ===================================================== */

        .winners-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 14px;
            gap: 10px;
        }

        .winners-header h2 {
            font-family: var(--display);
            font-size: 23px;

            margin: 0;
            font-weight: 700;

            color: var(--green-main);
        }

        #winnerTally {
            font-family: var(--display);
            font-size: 14px;

            color: #173C29;
            font-weight: 700;

            background: linear-gradient(
                135deg,
                #FFE28A,
                #E8C451
            );

            padding: 5px 12px;
            border-radius: 999px;

            white-space: nowrap;
        }

        .winners-list {
            display: flex;
            flex-direction: column;

            gap: 10px;

            max-height: 38vh;
            min-height: 90px;

            overflow-y: auto;
            padding-right: 4px;
        }

        .winners-list::-webkit-scrollbar {
            width: 6px;
        }

        .winners-list::-webkit-scrollbar-thumb {
            background: rgba(38, 115, 77, 0.35);
            border-radius: 6px;
        }

        .round-group {
            margin-bottom: 4px;
        }

        .round-tickets {
            display: grid;

            grid-template-columns: repeat(
                auto-fill,
                minmax(200px, 1fr)
            );

            gap: 10px;
        }

        .empty-state {
            border: 1px dashed rgba(38, 115, 77, 0.30);
            border-radius: 10px;

            padding: 26px 16px;

            text-align: center;

            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.55;

            background: rgba(232, 241, 232, 0.48);
        }

        /* Round label */

        .round-label {
            font-family: var(--display);
            font-size: 13px;
            font-weight: 700;

            color: var(--gold-dark);

            margin: 6px 0;
        }

        /* Winner ticket */

        .ticket {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            background: linear-gradient(
                135deg,
                rgba(239, 247, 237, 0.96),
                rgba(220, 232, 216, 0.96)
            );

            border: 1px solid rgba(38, 115, 77, 0.14);
            border-left: 4px solid var(--gold-main);

            border-radius: 9px;
            padding: 11px 14px;

            box-shadow:
                0 3px 10px rgba(23, 75, 53, 0.04);

            animation: dropIn 0.35s ease both;
        }

        .ticket .name {
            font-family: var(--display);
            font-size: 16px;
            font-weight: 600;

            color: var(--green-main);
            overflow-wrap: anywhere;
        }

        .ticket .badge {
            font-family: var(--display);
            font-size: 12px;

            color: #173C29;
            background: var(--gold-light);

            padding: 3px 9px;
            border-radius: 20px;

            font-weight: 700;
        }

        @keyframes dropIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .panel-actions {
            display: flex;
            gap: 10px;

            margin-top: 16px;
        }

        .panel-actions .btn {
            flex: 1;
        }

        .export-btn:disabled {
            background: #E3E8DD;
            border-color: #D1DCCF;

            color: #829786;
            box-shadow: none;
        }

        /* =====================================================
           11. WINNER MODAL
        ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(7, 30, 19, 0.72);

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.25s;

            z-index: 100;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 420px;

            background: linear-gradient(
                160deg,
                #286D49,
                #123B29
            );

            border: 1px solid var(--gold-main);
            border-top: 6px solid var(--gold-main);

            border-radius: 18px;

            padding: 28px 26px 24px;

            text-align: center;

            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.35),
                0 0 50px rgba(242, 201, 76, 0.18);

            transform: scale(0.88) translateY(14px);
            opacity: 0;

            transition:
                transform 0.32s cubic-bezier(.2, .9, .3, 1.3),
                opacity 0.25s;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-eyebrow {
            font-family: var(--display);
            font-size: 14px;

            color: var(--gold-light);

            margin-bottom: 6px;
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 4px;

            line-height: 1;
        }

        .modal-title {
            font-family: var(--display);
            font-size: 30px;
            font-weight: 700;

            margin: 0 0 18px;

            color: var(--gold-light);
        }

        .modal-winners {
            display: flex;
            flex-direction: column;

            gap: 9px;
            margin-bottom: 22px;

            max-height: 260px;
            overflow-y: auto;
        }

        .modal-winner-row {
            display: flex;
            align-items: center;

            gap: 10px;

            background: rgba(8, 35, 23, 0.70);

            border: 1px dashed rgba(242, 201, 76, 0.46);
            border-radius: 8px;

            padding: 10px 14px;

            opacity: 0;

            animation: modalRowIn 0.35s ease forwards;
        }

        .modal-winner-row .num {
            font-family: var(--display);
            font-size: 12px;
            font-weight: 700;

            color: #173C29;
            background: var(--gold-light);

            min-width: 24px;
            height: 24px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .modal-winner-row .wname {
            font-family: var(--display);
            font-size: 18px;
            font-weight: 600;

            color: var(--ivory);

            text-align: left;
            overflow-wrap: anywhere;
        }

        @keyframes modalRowIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .modal-close {
            width: 100%;

            background: linear-gradient(
                135deg,
                #FFE28A,
                #F2C94C,
                #D6A72C
            );

            border: none;

            color: #173C29;
            font-size: 16px;

            padding: 12px;
            border-radius: 9px;
        }

        .modal-close:hover:not(:disabled) {
            background: linear-gradient(
                135deg,
                #FFF0B5,
                #F7D96C,
                #E0B943
            );
        }

        /* =====================================================
           12. RESPONSIVE DESIGN
        ===================================================== */

        @media (max-width: 980px) {
            body {
                padding: 0 14px 32px;
            }

            .app {
                padding-top: 28px;
            }

            .side {
                grid-template-columns: minmax(0, 1fr);
            }

            .wheel-wrap {
                width: min(100%, 560px);
            }

            .winners-list {
                max-height: 48vh;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 0 10px 24px;
            }

            .card {
                padding: 16px;
            }

            .row {
                align-items: stretch;
                flex-direction: column;
            }

            #poolCount {
                text-align: center;
            }

            .controls {
                align-items: stretch;
                flex-direction: column;
            }

            .controls #spinBtn {
                width: 100%;
            }

            .wheel-wrap {
                margin-top: 26px;
            }

            .page-title {
                font-size: clamp(32px, 9vw, 40px);
            }

            .page-title span {
                letter-spacing: 0.08em;
            }

            .panel-actions {
                flex-direction: column;
            }
        }

        /* =====================================================
           13. REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            .wheel-disc {
                transition-duration: 1s;
            }

            .ticket,
            .modal-winner-row {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- MAIN WHEEL -->

        <section class="card wheel-card">

            <h1 class="page-title">
                Doorprize

                <span>
                    HUT KE-18 · PT DAYA ADICIPTA WISESA
                </span>
            </h1>

            <div class="wheel-wrap">

                <div
                    class="pointer-layer"
                    id="pointerLayer"
                ></div>

                <div
                    class="wheel-disc"
                    id="wheelDisc"
                >
                    <canvas
                        id="wheelCanvas"
                        width="900"
                        height="900"
                    ></canvas>
                </div>

                <div class="hub">
                    <img
                        src="logo-hut-18.png"
                        alt="Logo HUT ke-18 Excelerate"
                    >
                </div>

            </div>

            <div class="controls">

                <div class="field">

                    <label for="winnerCount">
                        Pemenang per putaran
                    </label>

                    <input
                        type="number"
                        id="winnerCount"
                        min="1"
                        value="1"
                    >

                </div>

                <button
                    class="btn"
                    id="spinBtn"
                >
                    PUTAR
                </button>

            </div>

            <div
                class="status"
                id="statusText"
            >
                Masukkan nama lalu klik "Muat ke roda".
            </div>

        </section>

        <!-- PARTICIPANTS AND WINNERS -->

        <div class="side">

            <!-- PARTICIPANT INPUT -->

            <section class="card">

                <h2 class="card-title">
                    Daftar peserta
                </h2>

                <textarea
                    id="namesInput"
                    aria-label="Daftar nama peserta, satu nama per baris"
                    placeholder="Contoh:&#10;Andi&#10;Budi&#10;Citra&#10;Dewi"
                ></textarea>

                <div class="row">

                    <button
                        class="btn load-btn"
                        id="loadBtn"
                    >
                        Muat ke roda
                    </button>

                    <span id="poolCount">
                        0 peserta di roda
                    </span>

                </div>

            </section>

            <!-- WINNER LIST -->

            <section class="card winners-panel">

                <div class="winners-header">

                    <h2>Pemenang</h2>

                    <span id="winnerTally">
                        0 / 0
                    </span>

                </div>

                <div
                    class="winners-list"
                    id="winnersList"
                >

                    <div class="empty-state">
                        Belum ada pemenang.<br>
                        Pemenang yang sudah keluar akan muncul di sini.
                    </div>

                </div>

                <div class="panel-actions">

                    <button
                        class="btn export-btn"
                        id="exportBtn"
                        disabled
                    >
                        ⬇ Export ke Excel
                    </button>

                    <button
                        class="btn reset-btn"
                        id="resetBtn"
                    >
                        Reset semua
                    </button>

                </div>

            </section>

        </div>

    </div>

    <!-- WINNER MODAL -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div class="modal-card">

            <div class="modal-eyebrow">
                Sesi <span id="modalRound">1</span>
            </div>

            <div class="modal-icon">
                🏆
            </div>

            <h3
                class="modal-title"
                id="modalTitle"
            >
                Pemenang!
            </h3>

            <div
                class="modal-winners"
                id="modalWinners"
            ></div>

            <button
                class="btn modal-close"
                id="modalCloseBtn"
            >
                Lanjutkan
            </button>

        </div>

    </div>

    <script>
        (function () {

            /* =================================================
               1. DOM ELEMENTS
            ================================================= */

            const namesInput =
                document.getElementById('namesInput');

            const loadBtn =
                document.getElementById('loadBtn');

            const poolCountEl =
                document.getElementById('poolCount');

            const winnerCountInput =
                document.getElementById('winnerCount');

            const spinBtn =
                document.getElementById('spinBtn');

            const statusText =
                document.getElementById('statusText');

            const wheelDisc =
                document.getElementById('wheelDisc');

            const canvas =
                document.getElementById('wheelCanvas');

            const ctx =
                canvas.getContext('2d');

            const winnersList =
                document.getElementById('winnersList');

            const winnerTally =
                document.getElementById('winnerTally');

            const resetBtn =
                document.getElementById('resetBtn');

            const exportBtn =
                document.getElementById('exportBtn');

            const pointerLayer =
                document.getElementById('pointerLayer');

            const modalOverlay =
                document.getElementById('modalOverlay');

            const modalRound =
                document.getElementById('modalRound');

            const modalTitle =
                document.getElementById('modalTitle');

            const modalWinners =
                document.getElementById('modalWinners');

            const modalCloseBtn =
                document.getElementById('modalCloseBtn');


            /* =================================================
               2. WHEEL COLORS
            ================================================= */

            const SEGMENT_COLORS = [
                '#174B35',
                '#F2C94C',
                '#26734D',
                '#FFF7DF',
                '#D6A72C'
            ];

            const SEGMENT_TEXT = [
                '#FFFFFF',
                '#173C29',
                '#FFFFFF',
                '#173C29',
                '#FFFFFF'
            ];

            const POINTER_COLORS = [
                '#FFE28A',
                '#FFFFFF',
                '#F2C94C',
                '#26734D',
                '#D6A72C'
            ];

            const WHEEL_FONT =
                "'Chakra Petch', Inter, sans-serif";


            /* =================================================
               3. APPLICATION STATE
            ================================================= */

            let pool = [];
            let winners = [];

            let round = 0;
            let totalEntered = 0;

            let currentRotation = 0;

            let spinning = false;
            let pointerCount = 1;


            /* =================================================
               4. NAME MANAGEMENT
            ================================================= */

            function normalizeNames(raw) {

                return raw
                    .split('\n')
                    .map(s => s.trim())
                    .filter(Boolean);

            }


            function clampWinnerInput() {

                let v = parseInt(
                    winnerCountInput.value,
                    10
                );

                if (isNaN(v) || v < 1) {
                    v = 1;
                }

                const max = Math.max(pool.length, 1);

                if (v > max) {
                    v = max;
                }

                winnerCountInput.value = v;

                return v;

            }


            function updatePoolCount() {

                poolCountEl.textContent =
                    pool.length + ' peserta di roda';

                winnerCountInput.max =
                    Math.max(pool.length, 1);

                clampWinnerInput();

                spinBtn.disabled =
                    pool.length === 0 || spinning;

            }


            /* =================================================
               5. WHEEL POINTERS
            ================================================= */

            function drawPointers(k) {

                pointerCount = k;

                pointerLayer.innerHTML = '';

                for (let j = 0; j < k; j++) {

                    const angle = j * (360 / k);

                    const arm =
                        document.createElement('div');

                    arm.className = 'pointer-arm';

                    arm.style.transform =
                        'rotate(' + angle + 'deg)';

                    const tri =
                        document.createElement('div');

                    tri.className = 'pointer-tri';

                    tri.style.borderTopColor =
                        POINTER_COLORS[
                            j % POINTER_COLORS.length
                        ];

                    arm.appendChild(tri);

                    pointerLayer.appendChild(arm);

                }

            }


            /* =================================================
               6. WHEEL OUTER RIM
            ================================================= */

            function drawRim(cx, cy, rOuter, rInner) {

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    rOuter,
                    0,
                    Math.PI * 2
                );

                ctx.arc(
                    cx,
                    cy,
                    rInner,
                    0,
                    Math.PI * 2,
                    true
                );

                ctx.fillStyle = '#174B35';

                ctx.fill();

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    rOuter,
                    0,
                    Math.PI * 2
                );

                ctx.strokeStyle = '#F2C94C';

                ctx.lineWidth = 3;

                ctx.stroke();

                const bulbs = 40;

                const rb = (rOuter + rInner) / 2;

                for (let i = 0; i < bulbs; i++) {

                    const a =
                        i / bulbs * Math.PI * 2;

                    const x =
                        cx + Math.cos(a) * rb;

                    const y =
                        cy + Math.sin(a) * rb;

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        5.5,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        i % 2 === 0
                            ? '#F2C94C'
                            : '#FFFDF4';

                    ctx.shadowColor =
                        i % 2 === 0
                            ? 'rgba(242,201,76,.95)'
                            : 'rgba(255,253,244,.85)';

                    ctx.shadowBlur = 8;

                    ctx.fill();

                    ctx.shadowBlur = 0;

                }

            }


            /* =================================================
               7. DRAW WHEEL
            ================================================= */

            function drawWheel() {

                const size = canvas.width;

                const cx = size / 2;
                const cy = size / 2;

                const rim = 26;

                const rOuter = size / 2 - 4;
                const r = rOuter - rim;

                ctx.clearRect(
                    0,
                    0,
                    size,
                    size
                );

                if (pool.length === 0) {

                    ctx.beginPath();

                    ctx.arc(
                        cx,
                        cy,
                        r,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = '#204832';

                    ctx.fill();

                    drawRim(
                        cx,
                        cy,
                        rOuter,
                        r
                    );

                    ctx.fillStyle = '#DCE8D8';

                    ctx.font =
                        '600 26px ' + WHEEL_FONT;

                    ctx.textAlign = 'center';

                    ctx.textBaseline = 'middle';

                    ctx.fillText(
                        'Roda kosong',
                        cx,
                        cy
                    );

                    return;

                }

                const n = pool.length;

                const segAngle =
                    Math.PI * 2 / n;

                const fontSize = Math.max(
                    6,
                    Math.min(21, 480 / n)
                );

                const maxChars =
                    n > 100
                        ? 4
                        : (
                            n > 60
                                ? 6
                                : (
                                    n > 30
                                        ? 10
                                        : (
                                            n > 14
                                                ? 16
                                                : 20
                                        )
                                )
                        );

                for (let i = 0; i < n; i++) {

                    const start =
                        -Math.PI / 2 + i * segAngle;

                    const end =
                        start + segAngle;

                    const ci =
                        i % SEGMENT_COLORS.length;

                    ctx.beginPath();

                    ctx.moveTo(cx, cy);

                    ctx.arc(
                        cx,
                        cy,
                        r,
                        start,
                        end
                    );

                    ctx.closePath();

                    ctx.fillStyle =
                        SEGMENT_COLORS[ci];

                    ctx.fill();

                    ctx.strokeStyle =
                        'rgba(23,75,53,.45)';

                    ctx.lineWidth = 2;

                    ctx.stroke();

                    ctx.save();

                    ctx.translate(cx, cy);

                    ctx.rotate(
                        start + segAngle / 2
                    );

                    ctx.textAlign = 'right';

                    ctx.textBaseline = 'middle';

                    ctx.fillStyle =
                        SEGMENT_TEXT[ci];

                    ctx.font =
                        '700 ' +
                        fontSize +
                        'px ' +
                        WHEEL_FONT;

                    let label = pool[i];

                    if (label.length > maxChars) {

                        label =
                            label.slice(0, maxChars - 1) +
                            '…';

                    }

                    ctx.fillText(
                        label,
                        r - 18,
                        0
                    );

                    ctx.restore();

                }

                drawRim(
                    cx,
                    cy,
                    rOuter,
                    r
                );

            }


            /* =================================================
               8. RENDER WINNERS
            ================================================= */

            function renderWinners() {

                if (winners.length === 0) {

                    winnersList.innerHTML =
                        '<div class="empty-state">' +
                        'Belum ada pemenang.<br>' +
                        'Pemenang yang sudah keluar akan muncul di sini.' +
                        '</div>';

                } else {

                    let html = '';

                    const rounds = [
                        ...new Set(
                            winners.map(w => w.round)
                        )
                    ].sort((a, b) => b - a);

                    for (const r of rounds) {

                        html +=
                            '<div class="round-group">' +
                            '<div class="round-label">' +
                            'Sesi ' + r +
                            '</div>' +
                            '<div class="round-tickets">';

                        const group =
                            winners.filter(
                                w => w.round === r
                            );

                        for (const w of group) {

                            html +=
                                '<div class="ticket">' +
                                '<span class="name">' +
                                escapeHtml(w.name) +
                                '</span>' +
                                '<span class="badge">#' +
                                w.order +
                                '</span>' +
                                '</div>';

                        }

                        html +=
                            '</div>' +
                            '</div>';

                    }

                    winnersList.innerHTML = html;

                }

                winnerTally.textContent =
                    winners.length +
                    ' / ' +
                    totalEntered;

                exportBtn.disabled =
                    winners.length === 0;

            }


            /* =================================================
               9. HTML ESCAPING
            ================================================= */

            function escapeHtml(str) {

                const d =
                    document.createElement('div');

                d.textContent = str;

                return d.innerHTML;

            }


            /* =================================================
               10. WINNER MODAL
            ================================================= */

            function showWinnerModal(names, roundNum) {

                modalRound.textContent = roundNum;

                modalTitle.textContent =
                    names.length > 1
                        ? names.length + ' Pemenang!'
                        : 'Pemenang!';

                modalWinners.innerHTML =
                    names.map((n, i) =>

                        '<div class="modal-winner-row" ' +
                        'style="animation-delay:' +
                        (i * 0.08) +
                        's">' +

                        '<span class="num">' +
                        (i + 1) +
                        '</span>' +

                        '<span class="wname">' +
                        escapeHtml(n) +
                        '</span>' +

                        '</div>'

                    ).join('');

                modalOverlay.classList.add('show');

                modalCloseBtn.focus();

            }


            function hideWinnerModal() {

                modalOverlay.classList.remove('show');

            }


            modalCloseBtn.addEventListener(
                'click',
                hideWinnerModal
            );


            modalOverlay.addEventListener(
                'click',
                e => {

                    if (e.target === modalOverlay) {
                        hideWinnerModal();
                    }

                }
            );


            document.addEventListener(
                'keydown',
                e => {

                    if (e.key === 'Escape') {
                        hideWinnerModal();
                    }

                }
            );


            /* =================================================
               11. LOAD PARTICIPANTS
            ================================================= */

            loadBtn.addEventListener(
                'click',
                function () {

                    const names =
                        normalizeNames(namesInput.value);

                    if (names.length === 0) {

                        statusText.textContent =
                            'Masukkan minimal satu nama.';

                        return;

                    }

                    pool = names;

                    winners = [];

                    round = 0;

                    totalEntered = names.length;

                    currentRotation = 0;

                    wheelDisc.style.transition = 'none';

                    wheelDisc.style.transform =
                        'rotate(0deg)';

                    void wheelDisc.offsetWidth;

                    wheelDisc.style.transition = '';

                    updatePoolCount();

                    drawWheel();

                    drawPointers(
                        clampWinnerInput()
                    );

                    renderWinners();

                    statusText.textContent =
                        names.length +
                        ' peserta siap diputar.';

                }
            );


            /* =================================================
               12. WINNER COUNT INPUT
            ================================================= */

            winnerCountInput.addEventListener(
                'input',
                function () {

                    const raw =
                        winnerCountInput.value;

                    const v =
                        parseInt(raw, 10);

                    if (
                        raw !== '' &&
                        !isNaN(v) &&
                        v >= 1 &&
                        pool.length > 0
                    ) {

                        drawPointers(
                            Math.min(v, pool.length)
                        );

                    }

                }
            );


            winnerCountInput.addEventListener(
                'blur',
                function () {

                    const v =
                        clampWinnerInput();

                    if (pool.length > 0) {
                        drawPointers(v);
                    }

                }
            );


            /* =================================================
               13. SPIN WHEEL AND SELECT WINNERS
            ================================================= */

            spinBtn.addEventListener(
                'click',
                function () {

                    if (
                        spinning ||
                        pool.length === 0
                    ) {
                        return;
                    }

                    const k =
                        clampWinnerInput();

                    spinning = true;

                    spinBtn.disabled = true;

                    loadBtn.disabled = true;

                    winnerCountInput.disabled = true;

                    statusText.textContent =
                        k +
                        ' panah akan menentukan pemenang…';

                    statusText.classList.add('live');

                    drawPointers(k);

                    const n = pool.length;

                    const segAngleDeg =
                        360 / n;

                    const extraSpins = 6;

                    const randomOffset =
                        Math.random() * 360;

                    currentRotation +=
                        extraSpins * 360 +
                        randomOffset;

                    wheelDisc.style.transform =
                        'rotate(' +
                        currentRotation +
                        'deg)';

                    setTimeout(function () {

                        const R =
                            (
                                (
                                    currentRotation % 360
                                ) + 360
                            ) % 360;

                        const used = new Set();

                        const winIndices = [];

                        for (let j = 0; j < k; j++) {

                            const pointerAngle =
                                j * (360 / k);

                            const localAngle =
                                (
                                    (
                                        pointerAngle - R
                                    ) % 360 + 360
                                ) % 360;

                            let idx = Math.floor(
                                localAngle / segAngleDeg
                            );

                            if (idx >= n) {
                                idx = n - 1;
                            }

                            let attempts = 0;

                            while (
                                used.has(idx) &&
                                attempts < n
                            ) {

                                idx = (idx + 1) % n;

                                attempts++;

                            }

                            used.add(idx);

                            winIndices.push(idx);

                        }

                        winIndices.sort(
                            (a, b) => a - b
                        );

                        round += 1;

                        const chosenNames =
                            winIndices.map(
                                i => pool[i]
                            );

                        chosenNames.forEach(
                            (name, i) => {

                                winners.push({
                                    name,
                                    round,
                                    order: i + 1
                                });

                            }
                        );

                        const removeSet =
                            new Set(winIndices);

                        pool = pool.filter(
                            (_, i) => !removeSet.has(i)
                        );

                        spinning = false;

                        loadBtn.disabled = false;

                        winnerCountInput.disabled = false;

                        drawWheel();

                        renderWinners();

                        updatePoolCount();

                        if (pool.length > 0) {

                            drawPointers(
                                clampWinnerInput()
                            );

                        }

                        statusText.classList.remove('live');

                        statusText.textContent =
                            pool.length === 0
                                ? 'Semua peserta sudah mendapat giliran.'
                                : chosenNames.length +
                                  ' pemenang baru — ' +
                                  pool.length +
                                  ' peserta tersisa.';

                        showWinnerModal(
                            chosenNames,
                            round
                        );

                    }, 4300);

                }
            );


            /* =================================================
               14. EXPORT WINNERS TO EXCEL
            ================================================= */

            exportBtn.addEventListener(
                'click',
                function () {

                    if (winners.length === 0) {
                        return;
                    }

                    if (
                        typeof XLSX === 'undefined'
                    ) {

                        statusText.textContent =
                            'Library Excel belum tersedia. ' +
                            'Periksa koneksi internet.';

                        return;

                    }

                    const rows = winners.map(w => ({

                        'No': w.order,

                        'Sesi': w.round,

                        'Nama Pemenang': w.name

                    }));

                    const ws =
                        XLSX.utils.json_to_sheet(rows);

                    ws['!cols'] = [
                        { wch: 6 },
                        { wch: 10 },
                        { wch: 28 }
                    ];

                    const wb =
                        XLSX.utils.book_new();

                    XLSX.utils.book_append_sheet(
                        wb,
                        ws,
                        'Daftar Juara'
                    );

                    const stamp = new Date()
                        .toISOString()
                        .slice(0, 19)
                        .replace(/[:T]/g, '-');

                    XLSX.writeFile(
                        wb,
                        'daftar-juara-' +
                        stamp +
                        '.xlsx'
                    );

                }
            );


            /* =================================================
               15. RESET APPLICATION
            ================================================= */

            resetBtn.addEventListener(
                'click',
                function () {

                    if (spinning) {
                        return;
                    }

                    pool = [];

                    winners = [];

                    round = 0;

                    totalEntered = 0;

                    currentRotation = 0;

                    namesInput.value = '';

                    wheelDisc.style.transition = 'none';

                    wheelDisc.style.transform =
                        'rotate(0deg)';

                    void wheelDisc.offsetWidth;

                    wheelDisc.style.transition = '';

                    winnerCountInput.value = 1;

                    updatePoolCount();

                    drawWheel();

                    drawPointers(1);

                    renderWinners();

                    hideWinnerModal();

                    statusText.classList.remove('live');

                    statusText.textContent =
                        'Masukkan nama lalu klik "Muat ke roda".';

                }
            );


            /* =================================================
               16. INITIALIZE APPLICATION
            ================================================= */

            drawWheel();

            drawPointers(1);

            updatePoolCount();

            if (
                document.fonts &&
                document.fonts.ready
            ) {

                document.fonts.ready.then(
                    drawWheel
                );

            }

        })();
    </script>

</body>
</html>
